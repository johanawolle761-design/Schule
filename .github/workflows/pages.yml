name: Deploy zu GitHub Pages

on:
  push:
    branches: ["claude/bild-anforderung-4otntt"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Seite vorbereiten
        run: |
          mkdir -p _site
          cp index.html _site/index.html

      - name: Artefakt hochladen
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deployen
        id: deployment
        uses: actions/deploy-pages@v4
